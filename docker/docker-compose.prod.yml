# Production stack for this fork: built from source, plus Postgres.
#
# This fork carries changes (i18n, this Traefik setup) that live only in
# fnoren17/weddingwebsite, not in the upstream ghcr.io/soccerbeats/weddingwebsite
# image — so unlike the upstream project's Portainer deploy, this stack builds
# the image locally on the server instead of pulling a published one.
#
#   git pull                     # on the server, inside the fork's checkout
#   docker compose -f docker/docker-compose.prod.yml up -d --build
#
# (In the Portainer stack the environment comes from the UI, not a .env file.)

name: weddingwebsite

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    image: wedding-web:local
    container_name: wedding-web-prod
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-net"
      - "traefik.http.routers.wedding.rule=Host(`wedding.felixnoren.com`)"
      - "traefik.http.routers.wedding.entrypoints=web"
      - "traefik.http.routers.wedding.middlewares=trust-forward-header@file"
      - "traefik.http.services.wedding.loadbalancer.server.port=3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - NODE_ENV=production
      # Optional, and all `:-` so an unset one is an empty string rather than a
      # compose warning. Each feature checks its own var and says so in the UI
      # when it is missing, so leaving any of these blank is a supported state.
      - JWT_SECRET=${JWT_SECRET:-}
      # RapidAPI key for AeroDataBox — turns on "Fill in from schedule" on a
      # honeymoon travel leg. Without it the button explains itself.
      - FLIGHT_API_KEY=${FLIGHT_API_KEY:-}
      - FLIGHT_API_HOST=${FLIGHT_API_HOST:-}
      # A private OSRM, if you ever run one. Defaults to the public demo server.
      - OSRM_URL=${OSRM_URL:-}
      # RSVP email notifications.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL:-}
      - GEOCODER_USER_AGENT=${GEOCODER_USER_AGENT:-}
      - NOMINATIM_URL=${NOMINATIM_URL:-}
    volumes:
      - photos_data:/app/public/photos
      - config_data:/app/public/config
    depends_on:
      - db
    networks:
      - proxy-net
      - wedding-internal

  db:
    image: postgres:15-alpine
    container_name: wedding-db-prod
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wedding-internal

volumes:
  postgres_data:
  photos_data:
  config_data:

networks:
  proxy-net:
    external: true
  wedding-internal:
    driver: bridge
